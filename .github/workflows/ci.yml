name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can inspect past commits, not just HEAD

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, gitleaks] # skip the build entirely if tests fail or a secret was found
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      image: ${{ steps.build.outputs.image }} # built ONCE here, reused by digest below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        env:
          IMAGE_REPO: ${{ github.repository }}
        run: |
          # ghcr.io requires a lowercase repository name; github.repository
          # preserves the org/user's actual casing (e.g. Chipp-W3/taskflow).
          IMAGE="ghcr.io/${IMAGE_REPO,,}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "image=ghcr.io/${IMAGE_REPO,,}@$digest" >> "$GITHUB_OUTPUT"

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read # pull the already-pushed image to scan it
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }} # scans the exact artifact that will be signed/deployed
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  cosign:
    name: Sign image (cosign)
    runs-on: ubuntu-latest
    needs: [build, trivy] # only sign an image that already passed the vuln scan
    permissions:
      contents: read
      packages: write # push the signature alongside the image
      id-token: write # required for keyless signing (GitHub OIDC token)
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ needs.build.outputs.image }}"

  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [build, cosign]
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Deploy
        run: ./deploy.sh staging "${{ needs.build.outputs.image }}"

      - name: Debug container state
        if: always()
        run: |
          docker ps -a
          docker logs taskflow-staging || true

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8001/ && echo

  deploy-production:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Deploy
        run: ./deploy.sh prod "${{ needs.build.outputs.image }}"

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8000/ && echo